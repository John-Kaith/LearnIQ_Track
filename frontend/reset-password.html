<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - LearnIQ Track</title>
    <script src="js/shared/theme-boot.js"></script>
<link rel="stylesheet" href="style.css" />
  <script src="js/shared/theme-toggle.js"></script>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-dark text-light min-h-screen flex items-center justify-center p-4">
  <main class="w-full max-w-md">
    <section class="glass-card content-card auth-card">
      <header class="auth-header">
        <div class="auth-logo">
          <i class="fa-solid fa-graduation-cap"></i>
          <span>LearnIQ Track</span>
        </div>
        <span class="status-badge online">Password Recovery</span>
      </header>

      <div class="auth-content">
        <h2>Set a New Password</h2>
        <p class="content-subtitle" id="reset-password-subtitle">Enter a new password for your account.</p>
      </div>

      <form id="reset-password-form" class="auth-form">
        <label>
          <span>New Password</span>
          <input id="reset-new-password" type="password" placeholder="At least 8 characters" minlength="8" required />
        </label>
        <label>
          <span>Confirm New Password</span>
          <input id="reset-confirm-password" type="password" placeholder="Re-enter password" minlength="8" required />
        </label>
        <p id="reset-password-field-error" class="auth-card-note" style="display:none;"></p>

        <button class="btn btn-primary btn-block" type="submit" id="reset-password-submit-btn">Update Password</button>
      </form>

      <p id="reset-password-message" class="auth-card-note" style="display:none;"></p>
      <p class="auth-link"><a href="login.html">Back to Login</a></p>
    </section>
  </main>

  <script src="js/shared/confirm-dialog.js"></script>
  <script src="js/learniq-config.js"></script>
  <script src="js/core/api.js"></script>
  <script src="script.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      setupResetPasswordPage();
    });
  </script>
</body>
</html>
