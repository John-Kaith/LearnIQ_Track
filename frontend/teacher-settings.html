<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings | LearnIQ Track</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="js/shared/theme-boot.js"></script>
<link rel="stylesheet" href="style.css?v=2026082005" />
  <script src="js/shared/theme-toggle.js"></script>
  <script src="js/shared/confirm-dialog.js" defer></script>
  <script src="js/learniq-config.js"></script>
  <script src="js/core/api.js"></script>
  <script src="script.js?v=2026082005" defer></script>
  <script src="js/shared/common-settings.js?v=2026051303" defer></script>
</head>
<body class="teacher-learniq-page" data-sidebar-active="settings">
  <div class="dashboard-shell container">
    <aside class="sidebar lq-sidebar">
      <div class="sidebar-header">
        <a class="brand" href="login.html">
          <span class="brand-mark">LQ</span>
          <span>
            <strong>LearnIQ Track</strong>
            <small>Teacher LearnIQ</small>
          </span>
        </a>
      </div>

      <nav class="side-links" aria-label="Teacher navigation"></nav>

      <div class="sidebar-footer">
        <a href="student-profile.html" class="user-chip user-chip-profile-link" id="teacher-profile-chip-link" aria-label="Open your profile">
          <div class="avatar" id="student-avatar-initials">TC</div>
          <div class="user-chip-text">
            <span id="student-display-name">Teacher</span>
            <div class="small-note" id="student-display-track"></div>
          </div>
        </a>
        <button type="button" class="btn btn-secondary btn-block sidebar-logout-btn" onclick="confirmAndLogout()">
          <i class="fa-solid fa-sign-out-alt" aria-hidden="true"></i> Logout
        </button>
      </div>
    </aside>

    <main class="main-panel">
      <section id="teacher-learniq-panel-head" class="glass-card panel-header">
        <div class="panel-title">
          <h1>Settings</h1>
          <p>Manage your account, appearance, and notification preferences.</p>
        </div>
      </section>

      <div id="common-settings-mount" class="fade-up delay-1"></div>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const target = document.getElementById("common-settings-mount");
        if (typeof mountCommonSettings === "function" && target) {
          mountCommonSettings(target);
        }
      });
    </script>
  </div>
</body>
</html>
