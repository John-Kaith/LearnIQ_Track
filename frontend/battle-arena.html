<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Clash | LearnIQ Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <script src="js/shared/theme-boot.js"></script>
  <link rel="stylesheet" href="style.css?v=2026100804" />
  <link rel="stylesheet" href="css/arcade-shell.css?v=2026100801" />
  <link rel="stylesheet" href="css/battle-arena.css?v=2026100801" />
  <script src="js/shared/confirm-dialog.js?v=2026092701" defer></script>
  <script src="js/learniq-config.js"></script>
  <script src="js/core/api.js"></script>
  <script src="script.js?v=2026100803" defer></script>
  <script src="js/arcade/arcade-shell.js?v=2026100801" defer></script>
  <script src="js/pages/battle-arena.entry.js?v=2026100801" defer></script>
</head>
<!-- Word Clash: a full-screen Arcade game (no LMS sidebar). Students reach it from the
     Arcade page (arcade.html) or the dashboard launcher. The menus, loading screen,
     fighter picker and pause menu are built by js/arcade/arcade-shell.js. -->
<body class="battle-arena-page battle-fullscreen-active arcade-game">
  <main class="wc-app" id="wc-app" aria-label="Word Clash"></main>

  <section class="battle-fight-screen" id="battle-fight-screen" hidden>
    <div class="battle-fight-inner">
      <div class="battle-stage">
        <div class="battle-stage-bg" aria-hidden="true">
          <div class="battle-stage-sky"></div>
          <div class="battle-stage-ground"></div>
        </div>

        <button type="button" class="btn btn-secondary btn-small battle-exit-btn" id="battle-pause-btn" aria-label="Pause (Esc)" title="Pause (Esc)">
          <i class="fa-solid fa-pause" aria-hidden="true"></i> Pause
        </button>

        <div class="battle-vs-badge">
          <div class="battle-timer" id="battle-timer" role="timer" aria-live="off" aria-label="Time left">
            <i class="fa-solid fa-stopwatch" aria-hidden="true"></i>
            <span id="battle-timer-value">15:00</span>
          </div>
          VS
          <div class="battle-streak" id="battle-streak" aria-live="polite">Streak 0/5</div>
        </div>

        <div class="battle-fighter battle-fighter-player" id="battle-player-fighter">
          <div
            class="battle-fighter-sprite battle-player-sprite-btn"
            id="battle-player-sprite"
            role="button"
            tabindex="0"
            aria-label="Change your character"
            title="Change character"
            aria-haspopup="dialog"
          >🧑‍🎓</div>
          <div class="battle-fighter-panel">
            <strong id="battle-fight-player-name">You</strong>
            <div class="battle-hp-row">
              <div class="battle-hp-bar"><div class="battle-hp-bar-fill" id="battle-player-hp-fill"></div></div>
              <span class="battle-hp-value" id="battle-player-hp-value">100/100</span>
            </div>
            <div class="battle-hearts" id="battle-player-hearts" aria-hidden="true"></div>
          </div>
        </div>

        <div class="battle-fighter battle-fighter-ai" id="battle-ai-fighter">
          <div class="battle-fighter-sprite" id="battle-ai-sprite" aria-hidden="true">🤖</div>
          <div class="battle-fighter-panel battle-fighter-panel-right">
            <strong><span id="battle-ai-name">AI Rival</span> <span class="battle-monster-level" id="battle-ai-level"></span></strong>
            <div class="battle-hp-row">
              <span class="battle-hp-value" id="battle-ai-hp-value">100/100</span>
              <div class="battle-hp-bar"><div class="battle-hp-bar-fill" id="battle-ai-hp-fill"></div></div>
            </div>
            <div class="battle-hearts" id="battle-ai-hearts" aria-hidden="true"></div>
          </div>
        </div>
      </div>

      <div class="battle-fight-board">
        <div class="battle-board-main">
          <div class="battle-ready-panel" id="battle-ready-panel" hidden>
            <p class="battle-ready-title">Ready?</p>
            <p class="battle-ready-text">
              You have <strong id="battle-ready-time">15:00</strong>. Correct answers add <strong>+3s</strong>, wrong answers cost
              <strong>-5s</strong>, and 5 correct in a row heals <strong>+5 HP</strong>.
            </p>
            <button type="button" class="btn btn-primary battle-start-btn" id="battle-start-btn">
              <i class="fa-solid fa-play" aria-hidden="true"></i> Start
            </button>
          </div>
          <div class="battle-question-panel">
            <p class="battle-question-label">Question</p>
            <p class="battle-question-text" id="battle-question-text" aria-live="polite">Loading question…</p>
          </div>
          <div class="battle-word-preview" id="battle-word-preview">
            <span class="battle-word-preview-text" id="battle-word-preview-text" aria-live="polite">
              <span class="battle-word-preview-placeholder" id="battle-word-preview-placeholder">Tap letters to spell the answer…</span>
            </span>
            <button
              type="button"
              class="battle-backspace-btn"
              id="battle-backspace-btn"
              aria-label="Delete last letter"
              title="Delete last letter (Backspace)"
              disabled
            >
              <i class="fa-solid fa-delete-left" aria-hidden="true"></i>
            </button>
          </div>
          <div class="battle-word-actions action-buttons">
            <button type="button" class="btn btn-secondary btn-small" id="battle-clear-btn">Clear</button>
            <button type="button" class="btn btn-secondary btn-small" id="battle-scramble-btn">
              <i class="fa-solid fa-shuffle" aria-hidden="true"></i> Scramble
            </button>
            <button type="button" class="btn btn-secondary btn-small" id="battle-hint-btn" title="Reveal the next correct letter">
              <i class="fa-solid fa-lightbulb" aria-hidden="true"></i> Hint <span id="battle-hint-count">3</span>
            </button>
            <button type="button" class="btn btn-primary btn-small" id="battle-attack-btn" disabled>
              <i class="fa-solid fa-bolt" aria-hidden="true"></i> Attack
            </button>
            <button type="button" class="btn btn-secondary btn-small" id="next-btn">
              NEXT <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
            </button>
          </div>
          <div class="battle-letter-grid" id="battle-letter-grid" role="group" aria-label="Letter tiles"></div>
        </div>

        <aside class="battle-words-used">
          <h4>Correct Answers</h4>
          <ul class="battle-words-used-list" id="battle-words-used-list">
            <li class="battle-words-used-empty" id="battle-words-used-empty">No answers yet — start attacking!</li>
          </ul>
        </aside>
      </div>
    </div>
  </section>
</body>
</html>
