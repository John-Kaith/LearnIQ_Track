<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Profile | LearnIQ Track</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="js/shared/theme-boot.js"></script>
<link rel="stylesheet" href="style.css" />
  <script src="js/shared/theme-toggle.js"></script>
  <script src="js/shared/confirm-dialog.js" defer></script>
  <script src="js/learniq-config.js"></script>
  <script src="js/core/api.js"></script>
  <script src="script.js?v=2026082700" defer></script>
</head>
<body data-sidebar-active="profile" class="profile-page">
  <main class="page-shell container">
    <div class="dashboard-shell">
      <aside class="sidebar lq-sidebar fade-up">
        <div class="sidebar-header">
          <div class="brand" style="gap:0.85rem;">
            <span class="brand-mark">LQ</span>
            <span>
              <strong>LearnIQ Track</strong>
              <small id="profile-brand-subtitle">Admin Control Center</small>
            </span>
          </div>
          <p class="small-note">Review approvals, activity, and system health from one view.</p>
        </div>
        <nav class="side-links" aria-label="Admin navigation"></nav>

<div class="sidebar-footer">
          <a href="admin-profile.html" class="user-chip user-chip-profile-link" title="Profile information" aria-current="page">
            <span class="avatar" id="admin-sidebar-avatar">PC</span>
            <div class="user-chip-text">
              <strong id="admin-sidebar-name">Principal Cruz</strong>
              <small id="admin-sidebar-role">Admin / Principal</small>
            </div>
          </a>
          <button type="button" class="btn btn-secondary btn-block" onclick="logoutAdmin()">
            <i class="fa-solid fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </aside>

      <section class="main-panel">
        <section class="glass-card panel-header fade-up delay-1">
          <div class="panel-title">
            <h1 id="profile-title">Administrator profile</h1>
            <p class="small-note" id="profile-subtitle">Your account information from this session.</p>
          </div>
        </section>

        <article class="glass-card content-card fade-up delay-2">
          <h3>Account details</h3>
          <div class="profile-kv-grid">
            <div class="profile-kv">
              <span class="small-note">Full name</span>
              <strong id="profile-full-name">—</strong>
            </div>
            <div class="profile-kv">
              <span class="small-note">Role</span>
              <strong id="profile-role">—</strong>
            </div>
            <div class="profile-kv">
              <span class="small-note">ID number</span>
              <strong id="profile-id-number">—</strong>
            </div>
            <div class="profile-kv">
              <span class="small-note">Email</span>
              <strong id="profile-email">—</strong>
            </div>
          </div>
          <p class="small-note" id="profile-hint" style="margin-top: 0.9rem;"></p>
        </article>
      </section>
    </div>
  </main>
</body>
</html>
