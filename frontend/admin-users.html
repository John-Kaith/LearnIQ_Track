<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users | LearnIQ Track</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="js/shared/theme-boot.js"></script>
<link rel="stylesheet" href="style.css" />
  <script src="js/shared/theme-toggle.js"></script>
  <script src="js/shared/confirm-dialog.js" defer></script>
  <script src="js/learniq-config.js"></script>
  <script src="js/core/api.js"></script>
  <script src="script.js?v=2026082005" defer></script>
  <script src="js/pages/admin-users.entry.js" defer></script>
</head>
<body data-sidebar-active="users">
  <main class="page-shell container">
    <div class="dashboard-shell">
      <aside class="sidebar lq-sidebar fade-up">
        <div class="sidebar-header">
          <div class="brand" style="gap:0.85rem;">
            <span class="brand-mark">LQ</span>
            <span>
              <strong>LearnIQ Track</strong>
              <small>Admin Control Center</small>
            </span>
          </div>
          <p class="small-note">Review approvals, activity, and system health from one view.</p>
        </div>
        <nav class="side-links" aria-label="Admin navigation"></nav>

<div class="sidebar-footer">
          <a href="admin-profile.html" class="user-chip user-chip-profile-link" title="Profile information">
            <span class="avatar" id="admin-sidebar-avatar">PC</span>
            <div class="user-chip-text">
              <strong id="admin-sidebar-name">Principal Cruz</strong>
              <small id="admin-sidebar-role">Admin / Principal</small>
            </div>
          </a>
          <button id="sidebar-logout" type="button" class="btn btn-secondary btn-block" onclick="logoutAdmin()">
            <i class="fa-solid fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </aside>

      <section class="main-panel">
        <section class="glass-card panel-header fade-up delay-1">
          <div class="panel-title">
            <h1>Users</h1>
            <p>View and manage all registered users.</p>
          </div>
        </section>

        <section class="glass-card fade-up delay-2" style="padding: 1rem 1.25rem 1.25rem;">
          <div class="workspace-tabs" role="tablist" aria-label="Filter users by role">
            <button type="button" class="workspace-tab is-active" data-users-role-tab="all" role="tab" aria-selected="true">
              All <span class="users-tab-count" id="users-tab-count-all">0</span>
            </button>
            <button type="button" class="workspace-tab" data-users-role-tab="student" role="tab" aria-selected="false">
              Students <span class="users-tab-count" id="users-tab-count-student">0</span>
            </button>
            <button type="button" class="workspace-tab" data-users-role-tab="teacher" role="tab" aria-selected="false">
              Teachers <span class="users-tab-count" id="users-tab-count-teacher">0</span>
            </button>
          </div>

          <div class="search-box" style="margin-top:1rem;">
            <input id="users-search" type="search" placeholder="Search by name, ID, or role..." />
            <button id="users-reset" class="btn btn-secondary">Reset</button>
          </div>
          <div class="table-overflow">
            <table class="data-table" id="users-table">
              <thead>
                <tr>
                  <th>Full Name</th>
                  <th>ID Number</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Created</th>
                </tr>
              </thead>
              <tbody id="users-table-body"></tbody>
            </table>
          </div>
        </section>
      </section>
    </div>
  </main>
</body>
</html>
