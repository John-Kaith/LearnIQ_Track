<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Registration | Teacher · LearnIQ Track</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="js/shared/theme-boot.js"></script>
<link rel="stylesheet" href="style.css?v=2026082115" />
  <script src="js/shared/theme-toggle.js"></script>
  <script src="js/shared/confirm-dialog.js" defer></script>
  <script src="js/learniq-config.js"></script>
  <script src="js/core/api.js"></script>
  <script src="script.js?v=2026082700" defer></script>
</head>
<body class="teacher-learniq-page teacher-student-registration-page" data-sidebar-active="student-registration">
  <div class="dashboard-shell container">
    <aside class="sidebar lq-sidebar">
      <div class="sidebar-header">
        <a class="brand" href="login.html">
          <span class="brand-mark">LQ</span>
          <span>
            <strong>LearnIQ Track</strong>
            <small>Teacher LearnIQ</small>
          </span>
        </a>
      </div>

      <nav class="side-links" aria-label="Teacher navigation"></nav>

      <div class="sidebar-footer">
        <a href="student-profile.html" class="user-chip user-chip-profile-link" id="teacher-profile-chip-link" aria-label="Open your profile">
          <div class="avatar" id="student-avatar-initials">TC</div>
          <div class="user-chip-text">
            <span id="student-display-name">Teacher</span>
            <div class="small-note" id="student-display-track"></div>
          </div>
        </a>
        <button type="button" class="btn btn-secondary btn-block sidebar-logout-btn" onclick="confirmAndLogout()">
          <i class="fa-solid fa-sign-out-alt" aria-hidden="true"></i> Logout
        </button>
      </div>
    </aside>

    <main class="main-panel">
      <section class="glass-card panel-header">
        <div class="panel-title">
          <h1>Student Registration</h1>
          <p>Register a new student account. The account is active immediately — no approval step needed.</p>
        </div>
      </section>

      <section class="glass-card fade-up teacher-reg-card">
        <div class="section-heading left-align compact" style="margin-bottom: 1rem;">
          <span class="pill"><i class="fa-solid fa-user-plus"></i> New student</span>
          <h2 style="margin: 0.35rem 0 0; font-size: 1.15rem;">Student registration form</h2>
        </div>

        <form id="teacher-student-reg-form" class="auth-form teacher-reg-form">
          <div class="two-field-grid">
            <label>
              <span>Last name</span>
              <input id="tsr-last-name" type="text" placeholder="Dela Cruz" autocomplete="family-name" required />
            </label>
            <label>
              <span>First name</span>
              <input id="tsr-first-name" type="text" placeholder="Juan" autocomplete="given-name" required />
            </label>
          </div>
          <div class="two-field-grid">
            <label>
              <span>Middle name</span>
              <input id="tsr-middle-name" type="text" placeholder="Optional" autocomplete="additional-name" />
            </label>
            <label>
              <span>Suffix</span>
              <input id="tsr-name-suffix" type="text" placeholder="e.g. Jr., Sr., III" autocomplete="off" />
            </label>
          </div>

          <label>
            <span>Learner Reference Number (LRN)</span>
            <input id="tsr-id" type="text" placeholder="e.g. 123456789012" required inputmode="numeric" autocomplete="off" />
          </label>

          <label>
            <span>Email</span>
            <input id="tsr-email" type="email" placeholder="name@school.edu" required autocomplete="email" />
          </label>

          <div class="two-field-grid">
            <label>
              <span>Year level</span>
              <select id="tsr-grade-level" required>
                <option value="">Select year</option>
                <option value="11">11</option>
                <option value="12">12</option>
              </select>
            </label>
            <label>
              <span>Strand</span>
              <select id="tsr-strand" required>
                <option value="">Select strand</option>
                <option value="ABM">ABM</option>
                <option value="HUMSS">HUMSS</option>
                <option value="STEM">STEM</option>
                <option value="TVL-HE">TVL-HE</option>
              </select>
            </label>
          </div>

          <label class="password-field">
            <span>Password</span>
            <div class="password-input-container">
              <input id="tsr-password" type="password" placeholder="Optional" autocomplete="new-password" />
                <button type="button" class="password-toggle-btn" onclick="togglePassword('tsr-password', this)">
                  <i class="fa-solid fa-eye"></i>
                </button>
              </div>
          </label>

          <button class="btn btn-primary btn-block" type="submit">Create student account</button>
        </form>

        <p id="tsr-message" class="auth-card-note" style="display: none; margin-top: 1rem;"></p>

        <div class="feature-stack" style="margin-top: 1.25rem;">
          <div><i class="fa-solid fa-envelope"></i><span>Student can sign in after confirming email</span></div>
          <div><i class="fa-solid fa-shield-halved"></i><span>Account is active once registered</span></div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
