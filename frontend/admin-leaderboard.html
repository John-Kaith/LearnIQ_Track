<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard | LearnIQ Track</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="js/shared/theme-toggle.js"></script>
  <script src="js/shared/confirm-dialog.js" defer></script>
  <script src="script.js?v=202605207" defer></script>
  <script src="js/pages/admin-leaderboard.entry.js" defer></script>
</head>
<body data-sidebar-active="leaderboard" class="leaderboard-page">
  <main class="page-shell container">
    <div class="dashboard-shell">
      <aside class="sidebar lq-sidebar fade-up">
        <div class="sidebar-header">
          <div class="brand" style="gap:0.85rem;">
            <span class="brand-mark">LQ</span>
            <span>
              <strong>LearnIQ Track</strong>
              <small>Admin Control Center</small>
            </span>
          </div>
          <p class="small-note">Review approvals, activity, and system health from one view.</p>
        </div>
        <nav class="side-links" aria-label="Admin navigation"></nav>

<div class="sidebar-footer">
          <a href="admin-profile.html" class="user-chip user-chip-profile-link" title="Profile information">
            <span class="avatar" id="admin-sidebar-avatar">PC</span>
            <div class="user-chip-text">
              <strong id="admin-sidebar-name">Principal Cruz</strong>
              <small id="admin-sidebar-role">Admin / Principal</small>
            </div>
          </a>
          <button id="sidebar-logout" type="button" class="btn btn-secondary btn-block" onclick="logoutAdmin()">
            <i class="fa-solid fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </aside>

      <section class="main-panel">
        <section class="glass-card panel-header fade-up delay-1">
          <div class="panel-title">
            <h1>Student Leaderboard</h1>
            <p>View quiz scores and student rankings.</p>
          </div>
        </section>
        <section class="glass-card fade-up delay-2">
          <div class="leaderboard-container">
            <div class="leaderboard-list" id="leaderboard-list"></div>
          </div>
        </section>
      </section>
    </div>
  </main>
</body>
</html>
