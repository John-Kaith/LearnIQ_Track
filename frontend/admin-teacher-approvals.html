<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teachers | LearnIQ Track</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="js/shared/theme-boot.js"></script>
<link rel="stylesheet" href="style.css" />
  <script src="js/shared/theme-toggle.js"></script>
  <script src="js/shared/confirm-dialog.js" defer></script>
  <script src="js/learniq-config.js"></script>
  <script src="js/core/api.js"></script>
  <script src="script.js?v=2026082707" defer></script>
  <script src="js/pages/admin-teacher-approvals.entry.js" defer></script>
</head>
<body data-sidebar-active="teacher-approvals">
  <main class="page-shell container">
    <div class="dashboard-shell">
      <aside class="sidebar lq-sidebar fade-up">
        <div class="sidebar-header">
          <div class="brand" style="gap:0.85rem;">
            <span class="brand-mark">LQ</span>
            <span>
              <strong>LearnIQ Track</strong>
              <small>Admin Control Center</small>
            </span>
          </div>
          <p class="small-note">Review approvals, activity, and system health from one view.</p>
        </div>

        <nav class="side-links" aria-label="Admin navigation"></nav>

<div class="sidebar-footer">
          <a href="admin-profile.html" class="user-chip user-chip-profile-link" title="Profile information">
            <span class="avatar" id="admin-sidebar-avatar">PC</span>
            <div class="user-chip-text">
              <strong id="admin-sidebar-name">Principal Cruz</strong>
              <small id="admin-sidebar-role">Admin / Principal</small>
            </div>
          </a>
          <button id="sidebar-logout" type="button" class="btn btn-secondary btn-block" onclick="logoutAdmin()" title="End your admin session">
            <i class="fa-solid fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </aside>

      <section class="main-panel">
        <section class="glass-card panel-header approvals-panel-head fade-up delay-1">
          <div class="panel-title">
            <h1>Teachers</h1>
            <p>All registered teachers. Click a name for profile details.</p>
          </div>
        </section>

        <section class="glass-card fade-up delay-2" style="padding: 1rem 1.25rem 1.25rem;">
          <div class="search-box">
            <input id="teacher-approval-search" type="search" placeholder="Search by name, ID, or email..." />
            <button id="teacher-approval-reset" class="btn btn-secondary" type="button">Reset</button>
          </div>

          <div class="table-overflow" style="margin-top: 1rem;">
            <table class="data-table" id="teacher-approval-table">
              <thead>
                <tr>
                  <th>Full Name</th>
                  <th>ID Number</th>
                  <th>Email</th>
                  <th>Created</th>
                </tr>
              </thead>
              <tbody id="teacher-approval-table-body"></tbody>
            </table>
          </div>
        </section>
      </section>
    </div>
  </main>

  <div id="teacher-profile-modal" class="action-modal-backdrop teacher-profile-modal" hidden>
    <div class="action-modal glass-card teacher-profile-modal-panel" role="dialog" aria-modal="true" aria-labelledby="teacher-profile-modal-title">
      <div class="action-modal-head">
        <h3 id="teacher-profile-modal-title">Teacher profile</h3>
        <button type="button" class="btn btn-ghost teacher-profile-modal-close" aria-label="Close">&times;</button>
      </div>
      <p class="small-note" style="margin:0;">Supabase · <code>profiles</code></p>
      <div id="teacher-profile-modal-body" class="teacher-profile-modal-body"></div>
    </div>
  </div>
</body>
</html>
