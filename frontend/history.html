<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>History | LearnIQ Track</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="js/shared/theme-boot.js"></script>
<link rel="stylesheet" href="style.css" />
  <script src="js/shared/theme-toggle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
  <script src="js/shared/reviewer-markdown.js?v=202605153" defer></script>
  <script src="js/shared/confirm-dialog.js" defer></script>
  <script src="js/learniq-config.js"></script>
  <script src="js/core/api.js"></script>
  <script src="script.js" defer></script>
</head>
<body class="history-page" data-sidebar-active="history">
  <div class="dashboard-shell container">
    <aside class="sidebar lq-sidebar">
      <div class="sidebar-header">
        <a class="brand" href="login.html">
          <span class="brand-mark">LQ</span>
          <span>
            <strong>LearnIQ Track</strong>
            <small>LearnIQ Module</small>
          </span>
        </a>
      </div>

      <nav class="side-links">
        <a href="learniq-dashboard.html"><i class="fa-solid fa-graduation-cap"></i> LearnIQ Dashboard</a>
        <a href="subjects.html"><i class="fa-solid fa-book-open"></i> My lesson</a>
        <a href="leaderboard.html"><i class="fa-solid fa-trophy"></i> Leaderboard</a>
        <a class="active" href="history.html"><i class="fa-solid fa-clock-rotate-left"></i> History</a>
        <a href="module-selection.html"><i class="fa-solid fa-th-large"></i> Module Selection</a>
        <a href="student-settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
      </nav>

      <div class="sidebar-footer">
        <a href="student-profile.html" class="user-chip user-chip-profile-link" id="student-profile-chip-link" aria-label="Open your profile">
          <div class="avatar" id="student-avatar-initials">ST</div>
          <div class="user-chip-text">
            <span id="student-display-name">Student</span>
            <div class="small-note" id="student-display-track">STEM - 12 A</div>
          </div>
        </a>
        <button type="button" class="btn btn-secondary btn-block sidebar-logout-btn" onclick="confirmAndLogout()">
          <i class="fa-solid fa-sign-out-alt" aria-hidden="true"></i> Logout
        </button>
      </div>
    </aside>

    <main class="main-panel">
      <section class="glass-card panel-header">
        <div class="panel-title">
          <h1>History</h1>
          <p>Review what you've worked on: quizzes you've taken, reviewers you've opened, and activities you've explored.</p>
        </div>
      </section>

      <section class="glass-card fade-up" style="padding: 1rem 1.25rem 1.25rem;">
        <div class="workspace-tabs" role="tablist" aria-label="Filter history by type">
          <button type="button" class="workspace-tab is-active" data-history-tab="quiz" role="tab" aria-selected="true">
            <i class="fa-solid fa-clipboard-question" aria-hidden="true"></i>
            Quiz <span class="users-tab-count" id="history-tab-count-quiz">0</span>
          </button>
          <button type="button" class="workspace-tab" data-history-tab="reviewer" role="tab" aria-selected="false">
            <i class="fa-solid fa-book" aria-hidden="true"></i>
            Reviewer <span class="users-tab-count" id="history-tab-count-reviewer">0</span>
          </button>
          <button type="button" class="workspace-tab" data-history-tab="activity" role="tab" aria-selected="false">
            <i class="fa-solid fa-pen-to-square" aria-hidden="true"></i>
            Activity <span class="users-tab-count" id="history-tab-count-activity">0</span>
          </button>
        </div>

        <div id="history-list-host" class="history-list" style="margin-top: 1.25rem;">
          <p class="small-note">Loading your history…</p>
        </div>
      </section>
    </main>
  </div>

  <div id="history-detail-modal" class="action-modal-backdrop history-detail-backdrop" hidden>
    <div class="glass-card action-modal history-detail-modal" role="dialog" aria-modal="true" aria-labelledby="history-detail-title">
      <div class="action-modal-head">
        <div class="history-detail-head-text">
          <h3 id="history-detail-title">Details</h3>
          <p class="small-note" id="history-detail-subtitle"></p>
        </div>
        <button type="button" class="btn btn-secondary history-detail-close" id="history-detail-close" aria-label="Close">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
      <div class="history-detail-body" id="history-detail-body">
        <p class="small-note">Loading…</p>
      </div>
      <div class="history-detail-footer">
        <button type="button" class="btn btn-primary history-detail-download" id="history-detail-download">
          <i class="fa-solid fa-file-arrow-down" aria-hidden="true"></i>
          Download as PDF
        </button>
      </div>
    </div>
  </div>
</body>
</html>
